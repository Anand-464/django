{% extend 'layout/base.html' %}
{% block 'content' %}
    <p>{{message}}</p> 
<table border="1">
    <tr>
    <th>name</th>
    <th>year</th>
    <th>genre</th>
    <th>rating</th></tr>
{%for customer in data %}
    <tr>
    <td>{{customer.name}}</td>
    <td>{{customer.year}}</td>
    <td>{{customer.genre}}</td>
    <td>{{customer.rating}}</td>
    </tr>
{%endfor%}
{% endblock %}
