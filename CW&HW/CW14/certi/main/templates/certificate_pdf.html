<!DOCTYPE html>
<html lang="en">
<head>
    <title>Certificate of Completion</title>
</head>

<body>
    <div class="certificate">
        <h1>CERTIFICATE OF COMPLETION</h1>
        <p>This certificate is proudly awarded to <strong>{{ certificate.student_name }}</strong></p>
        <p>for successfully completing the course in <strong>{{ certificate.course_name }}</strong></p>
        <p>Completion Date: <strong>{{ certificate.completion_date }}</strong></p>
        <div class="footer">
            Issued by the Training Institute of ABCD
        </div>
    </div>
</body>
</html>
