{%extends 'layout/base.html'%}
{%block 'content'%}
<h1>Homepage</h1>

<form method="get" action="{% url 'student_home' %}">
    <input type="text" name="search" placeholder="Search by name" value="{{ query }}">
    <button type="submit">Search</button>
    <a href="{% url 'student_home' %}">Show All</a>
</form>
<table border="1">
    <tr>
        <th>Name</th>
        <th>Class</th>
        <th>Age</th>
        <th colspan="2">Actions</th>
    </tr>
        {%for student in student_list%}
    <tr>
        <td>{{ student.name }}</td>
        <td>{{ student.stu_class }} </td> 
        <td>{{ student.age }}</td>
        <td><a href="{% url 'student_update' student.pk %}" class="btn btn-success" value="edit" type="submit">Edit</a></td>
        <td><a href="{% url 'student_delete' student.pk %}" class="btn btn-success" value="edit" type="submit">Delete</a></td>
    <tr>
</td>
    </tr>
     {% endfor %}
    </table> 

{% endblock %}
