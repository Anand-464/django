<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
</head>
<body>
    <h1>Product Management System</h1>
    <a href="{% url 'add_product' %}">
        <button type="button">Add New Product</button>
    </a>

    <table border="1">
        <tr><th>Product_id</th>
            <th>Product_name</th>
            <th>Product_price</th>
            <th>Product_description</th>
            <th colspan="2">Actions</th>
        </tr>
        {%for products in product_list%}
        <tr>
            <td>{{products.id}}</td>
            <td>{{ products.name }} </td> 
            <td>{{ products.price }}</td>
            <td>{{ products.description }}</td>
            <td>
                <a href="{% url 'generate_pdf' products.id %}">
                    <button type="button">Download as PDF</button>
                </a>
            </td>
           <td>
                <a href="{% url 'send_product_email' products.id %}">
                    <button type="button">Send Product Info by Email</button>
                </a>
            </td>
        </tr>
        {% endfor %}


    </table> 
</body>
</html>
