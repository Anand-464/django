<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Information</title>
</head>
<body>
    <h1>Product Information</h1>
    <table>
        <tr>
            <th>Product ID</th>
            <td>{{ product.id }}</td>
        </tr>
        <tr>
            <th>Product Name</th>
            <td>{{ product.name }}</td>
        </tr>
        <tr>
            <th>Description</th>
            <td>{{ product.description }}</td>
        </tr>
        <tr>
            <th>Price</th>
            <td>Rs. {{ product.price }}</td>
        </tr>
    </table>
</body>
</html>
