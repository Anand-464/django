{%extends 'layout/base.html'%}
{%block 'content'%}
<h1>Homepage</h1>
<table border="1">
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th colspan="2">Actions</th>
    </tr>
        {%for book in book_list%}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.author }} </td> 
        <td>{{ book.year }}</td>
        <td><a href="{% url 'book_update' book.pk %}" class="btn btn-success" value="edit" type="submit">Edit</a></td>
        <td><a href="{% url 'book_delete' book.pk %}" class="btn btn-success" value="edit" type="submit">Delete</a></td>
    </tr>
     {% endfor %}
    </table> 
{%endblock%}
