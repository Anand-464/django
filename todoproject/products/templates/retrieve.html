{%extends 'layout/app-layout.html'%}
{%block 'content'%}
<h1>Retrieve Products</h1>
<table border="1">
    <tr><th>Product_id</th>
        <th>Product_name</th>
        <th>Product_price</th>
        <th colspan="2">Update</th>
    </tr>
        {%for products in product_list%}
    <tr>
        <td>{{products.id}}</td>
        <td>{{ products.name }} </td> 
        <td>{{ products.price }}</td>
        <td><a href="{% url 'updateproduct' products.id %}" class="btn btn-success" value="edit" type="submit">Edit</a></td>
        <td><a href="{% url 'deleteproduct' products.id %}" class="btn btn-success" value="edit" type="submit">Delete</a></td>
    </tr>
     {% endfor %}
    </table> 
{%endblock%}
